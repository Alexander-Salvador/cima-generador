ovav_compatibility: ">=1.1.0"
target_runtime: google_sheets
target_locale: es-PE
timezone: America/Lima
currency: PEN

apps_script:
  status: DISABLED
  disabled_at: 2026-09-22
  reason: "CEO directive — Apps Script eliminated. Spreadsheet uses native formulas + bridge CLI."
  bound_script_status: "orphan placeholder, not deletable via API (requires UI deletion)"

bridge_cli:
  binary: go-runtime/cmd/sheets
  entrypoint: "go run -C go-runtime ./cmd/sheets <subcommand>"
  oauth_storage: ".ovav/vault/credentials/google_oauth.enc (AES-256-GCM)"
  vault_key: "~/.config/ovav/vault.key"
  primary_subcommands:
    - cima-schema
    - cima-modules
    - cima-test
    - cima-lint
    - cima-ci
    - cima-drift
    - cima-bundle
    - cima-verify

scope:
