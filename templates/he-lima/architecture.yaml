  owner_real: "WILLIAMS ALEXANDER HUERTA SALVADOR (DNI 76292664)"
  city: Lima
  country: PE
  headcount_actual: 25
  active_default: 21
  ceased: 4
  scope_weeks: 4  # W del mes visible (1-4 semanas)

# ─────────────────────────────────────────────────────────────
# SHEETS — REAL schema (5 tabs, ALL UPPERCASE)
# ─────────────────────────────────────────────────────────────

sheets:

  - id: config
    name: "CONFIG"
    purpose: "Parámetros del sistema — zona orientativa + operativa"
    visibility: visible
    rows_used: 30
    cols_used: 3
    color_tab: navy
    rows_meaning:
      - "fila 1: title 'CONFIG — Parámetros del Sistema CIMA'"
      - "fila 2: vacía"
      - "fila 3: 'ZONA ORIENTATIVA — Datos de apoyo, ayuda (NO afecta al sistema)'"
      - "filas 5-11: referencia (Documento canónico, Empresa, Owner, Convenciones)"
      - "fila 13: '═══ ZONA OPERATIVA — Datos que SÍ afectan al sistema ═══'"
      - "filas 14+: parámetros operativos (Máx HE semanal, Catálogo Turnos)"

  - id: feriados_pe
    name: "01_FERIADOS_PE"
    purpose: "Calendario de feriados Perú (NACIONAL + PASCUA)"
    visibility: visible
    rows_used: 50
    cols_used: 5
    columns:
      - col: A
        header: "FECHA"
        type: date
      - col: B
        header: "NOMBRE"
        type: text
      - col: C
        header: "AÑO"
        type: number
      - col: D
        header: "TIPO"
        type: enum   # NACIONAL | PASCUA
      - col: E
        header: "OBSERVACIONES"
        type: text
    data_scope: "2025-2028+ (50+ filas)"
    notes: "Tipos: NACIONAL (inamovible) o PASCUA (móvil). Source = D.L. 713 + Pascua computada."

  - id: personal
    name: "PERSONAL"
    purpose: "Maestro de personas — 25 empleados"
    visibility: visible
    rows_used: 27   # header + 25 personas + buffer
    cols_used: 8
    color_tab: blue
    columns:
      - col: A
        index: 1
        header: "N°"
        type: number
      - col: B
        index: 2
        header: "DNI"
        type: text   # 8 dígitos, leading zeros perdidos
      - col: C
        index: 3
        header: "NOMBRES_COMPLETOS"
        type: text
      - col: D
        index: 4
        header: "TELEFONO"
        type: text   # 9 dígitos
      - col: E
        index: 5
        header: "HORARIO"
        type: text   # "12:00 - 21:00" formato
      - col: F
        index: 6
        header: "ESTADO"
        type: enum   # Activo | Cese
      - col: G
        index: 7
        header: "CARGO"
        type: text   # RAC TELEFONICO
      - col: H
        index: 8
        header: "AREA"
        type: text   # JEFATURA TECNICA
    data_scope: "25 personas reales"

  - id: horas_extras
    name: "HORAS EXTRAS"
    purpose: "Working surface — semanal con empleados × días del mes"
    visibility: visible
    rows_used: 33   # 8 header rows + 25 empleados
    cols_used: 12  # Mínimo — días como columnas (W del mes)
    color_tab: orange
    header_rows:
      - row: 1
        content: "CONTROL DE HORAS EXTRAS"
      - row: 2
        content: "Summary labels (HE Totales, Empleados)"
      - row: 3
        content: "Summary values (0, 25)"
      - row: 5
        content: "Año selector (col B)"
      - row: 6
        content: "Mes selector (col B)"
      - row: 7
        content: "Day numbers (1-7) — cols E-K"
      - row: 8
        content: "Day letters (M X J V S D L) — cols E-K"
    data_start_row: 9
    employees_in_col_B: true
    notes: "Layout weekly-view. Días como columnas (no filas). 4 semanas del mes visible."

  - id: feedbacks
    name: "Feedbacks"
    purpose: "Auditoría semanal de calidad de llamadas"
    visibility: visible
    rows_used: 9
    cols_used: 5
    columns:
      - col: A
        header: "FECHA"
      - col: B
        header: "SUPERVISOR"
      - col: C
        header: "AGENTE"
      - col: D
        header: "DNI"
      - col: E
        header: "CALL_ID"
    notes: "NO es dashboard — es auditoría de calidad. '20_Dashboard' v0.3.0 spec NO EXISTE."

