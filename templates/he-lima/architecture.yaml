# OVAV Template Architecture — he-lima
# Schema: OVAV TEMPLATE v1 (canonical)
# Authority: marco (systems_architect) · area=platform_engineering · lead=thavren
# Status: design-revised (CEO feedback incorporated)
# Reviewed: 2026-09-24
# Revision: v0.1.0-arch → v0.2.0-rev
#   · CORR-1: Working surface model (no accumulable fact table → no 50k risk)
#   · CORR-2: 13 feriados PE validados D.L. 713 (eliminar Carnaval/Aniversario Lima)
#   · CORR-3: Nuevo módulo 08_DBSync.gs (load/save entre grid y DB mensual)
#   · CORR-4: 01_Feriados_PE ahora visible (referencia CEO)

metadata:
  template_id: he-lima
  template_name: "CIMA — Tracking Horas Extras Lima"
  version: 0.2.0-rev
  status: design-revised
  owner_architect: marco
  owner_implementer: andres
  ceo_sponsor: braka
  created: 2026-09-24T00:00:00-05:00
  updated: 2026-09-24T00:00:00-05:00
  revision_history:
    - {version: 0.1.0-arch, date: 2026-09-24, note: "design inicial con fact table 18,250 filas"}
    - {version: 0.2.0-rev, date: 2026-09-24, note: "revisión CEO: working surface + partición mensual"}
  ovav_compatibility: ">=1.1.0"
  target_runtime: google_sheets
  target_locale: es-PE
  timezone: America/Lima
  currency: PEN
  scope:
    team: "CIMA — Técnica Móvil"
    city: Lima
    country: PE
    headcount_min: 20
    headcount_max: 50
    history_months: 12
    active_year_default: 2026
  supersedes: "excel-desktop-legacy (captura braka)"
  replaces_sheet: "CIMA —/Técnica Móvil · hoja=HE (actual desordenada)"
  dependencies:
    ovav_go_runtime: ">=1.1.0"
    apps_script_runtime: V8
    external_apis: []   # ningún fetch externo — todo local para performance
    sheets_limits_awareness:
      max_cells_per_sheet: 10000000
      max_rows_per_sheet: 50000
      max_formula_chain_depth: 50
      apps_script_exec_timeout_sec: 360
      triggers_per_user: 30
      cache_size_mb: 50
      urlfetch_quota_daily: 20000

# ─────────────────────────────────────────────────────────────
# SHEETS — cada hoja del spreadsheet (18 totales: 6 base + 12 mensuales)
# ─────────────────────────────────────────────────────────────
sheets:

  - id: cfg
    name: "00_Config"
    purpose: "Panel de control + parámetros globales + anclas"
    visibility: protected
    rows_used: 60
    cols_used: 8
    color_tab: "#1F2937"
    anchors:
      B2: "mes_dropdown (1-12)"
      B3: "anio_dropdown (2024-2030)"
      B4: "semana_dropdown (W01..W53)"
      B5: "persona_filtro_dropdown"
      B6: "factor_he_diurno (default 1.25)"
      B7: "factor_he_nocturno (default 1.35)"
      B8: "factor_feriado (default 2.00)"
      B9: "jornada_max_diaria (default 8)"
      B11: "ultimo_refresh timestamp"
    columns:
      - col: A
        header: "Param"
        type: text
      - col: B
        header: "Valor"
        type: mixed
      - col: C
        header: "Notas"
        type: text
        width: 50

  - id: holidays
    name: "01_Feriados_PE"
    purpose: "Calendario de feriados Perú (13 nacionales validados D.L. 713)"
    visibility: visible   # CORR-4: CEO quiere ver lista como referencia
    rows_used: 25         # 13 feriados + header + margen
    cols_used: 6
    color_tab: "#DC2626"
    columns:
      - col: A
        header: "ID"
        type: text   # F-NN
      - col: B
        header: "Nombre"
        type: text
      - col: C
        header: "Tipo"
        type: enum   # nacional_fijo | nacional_movil
      - col: D
        header: "Fecha"
        type: date
      - col: E
        header: "Es_Movil"
        type: bool   # calculado por Pascua
      - col: F
        header: "Aplica_HE"
        type: bool   # true = paga factor feriado

  - id: personas
    name: "02_Personas"
    purpose: "Maestro de personas (FK lógica hacia registros)"
    visibility: visible
    rows_used: 60
    cols_used: 10
    color_tab: "#2563EB"
    columns:
      - col: A
        header: "ID_Persona"
        type: text   # P-NNN
        pk: true
      - col: B
        header: "DNI"
        type: text   # 8 dígitos
      - col: C
        header: "Apellidos_Nombres"
        type: text
      - col: D
        header: "Cargo"
        type: enum   # tecnico | supervisor | jefe_cuadrilla | admin
      - col: E
        header: "Cuadrilla"
        type: enum   # A | B | C | D
      - col: F
        header: "Turno_Base"
        type: enum   # diurno | nocturno | rotativo
      - col: G
        header: "Fecha_Ingreso"
        type: date
      - col: H
        header: "Activo"
        type: bool
      - col: I
        header: "Tarifa_Hora_PEN"
        type: number   # decimal(8,2)
      - col: J
        header: "Notas"
        type: text

  - id: registro
    name: "10_Registro_HE"
    purpose: "WORKING SURFACE — grid de trabajo visible, ~100 filas, sincronizada con 98_DB_YYYY_MM"
    visibility: visible
    is_fact_table: false      # CORR-1: NO es fact table acumulable
    is_working_surface: true  # CORR-1: superficie emula Excel desktop
    rows_used: 110            # 50 personas × 5 días visibles + header + buffer
    cols_used: 22
    color_tab: "#059669"
    header_row: 1
    freeze: "A2:C2"
    sync_strategy: "load_save_db_sync"   # ver módulo 08_DBSync.gs
    partition_key: "Mes_Año (YYYY-MM)"
    notes: "Cambiar dropdown mes/año/semana SOBREESCRIBE el grid. Datos reales viven en 98_DB_YYYY_MM oculta."
    columns:
      - col: A
        header: "Fecha"
        type: date
        format: "yyyy-MM-dd"
      - col: B
        header: "ISO_Week"
        type: text   # calculado: TEXT(WEEKNUM(A,21))
      - col: C
        header: "Dia_Semana"
        type: enum   # lun-mar-mie-jue-vie-sab-dom
      - col: D
        header: "Es_Feriado"
        type: bool   # lookup directo 01_Feriados_PE!D:D
      - col: E
        header: "Tipo_Dia"
        type: enum   # Normal | Sabado | Domingo | Feriado
      - col: F
        header: "ID_Persona"
        type: fk   # → 02_Personas.A
      - col: G
        header: "Apellidos_Nombres"
        type: lookup   # VLOOKUP desde 02_Personas
      - col: H
        header: "Turno"
        type: enum   # diurno | nocturno
      - col: I
        header: "Hora_Ingreso"
        type: time
        format: "HH:mm"
      - col: J
        header: "Hora_Salida"
        type: time
        format: "HH:mm"
      - col: K
        header: "Horas_Total"
        type: number   # decimal(4,2)
      - col: L
        header: "Horas_Normales"
        type: number   # decimal(4,2)
      - col: M
        header: "Horas_Extras"
        type: number   # decimal(4,2)
      - col: N
        header: "Factor_Aplicado"
        type: number   # decimal(3,2)
      - col: O
        header: "Horas_Ponderadas"
        type: number   # decimal(6,2)   # K * N
      - col: P
        header: "Pago_HE_PEN"
        type: number   # decimal(10,2)
      - col: Q
        header: "Observaciones"
        type: text
      - col: R
        header: "Aud_Usuario"
        type: text   # email editor
      - col: S
        header: "Aud_Timestamp"
        type: datetime
      - col: T
        header: "Estado"
        type: enum   # borrador | validado | aprobado | pagado
      - col: U
        header: "Mes_Año"
        type: text   # YYYY-MM (sincroniza con 98_DB_YYYY_MM)
      - col: V
        header: "Sync_Status"
        type: enum   # synced | pending | conflict (sincronización DB)

  - id: dashboard
    name: "20_Dashboard"
    purpose: "KPIs ejecutivos — solo lectura + gráficos"
    visibility: visible
    rows_used: 40
    cols_used: 12
    color_tab: "#7C3AED"
    anchors:
      A1: "KPI cards (4 bloques)"
      A10: "Tabla resumen por persona"
      A20: "Gráfico HE mensual (column)"
      A30: "Heatmap semana × persona"
    data_source_strategy: "INDIRECT('98_DB_' & B3 & '_' & TEXT(B2, '00'))"

  # CORR-1: 12 hojas mensuales ocultas (storage real)
