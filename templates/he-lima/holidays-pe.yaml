# ─────────────────────────────────────────────────────────────
# ALGORITMO DE PASCUA — referencia (NO implementación aquí)
# ─────────────────────────────────────────────────────────────
algoritmo_pascua:
  nombre: "Anonymous Gregorian algorithm (Meeus/Jones/Butcher 1987)"
  referencia: https://en.wikipedia.org/wiki/Date_of_Easter
  input: "year (1583 ≤ year ≤ 4099)"
  output: "Date — Pascua de Resurrección (domingo)"
  complejidad: "O(1), aritmética entera"
  apps_script_function: "calcularPascua(anio)"
  downstream:
    - "calcularJuevesSanto(anio) = Pascua − 3 días → F-02"
    - "calcularViernesSanto(anio) = Pascua − 2 días → F-03"
  casos_borde:
    - "Años bisiestos: cubiertos nativamente por el algoritmo"
    - "Antes de 1583: no aplica (rango de Gregorio)"
    - "Año 2038+: precisión Date en Apps Script OK hasta 2200"
  validacion_2026:
    pascua_2026: "2026-04-05"
    fuente_validacion: "Algoritmo Meeus/Jones/Butcher + verificación contra calendarios oficiales"
    jueves_santo_2026: "2026-04-02"
    viernes_santo_2026: "2026-04-03"

